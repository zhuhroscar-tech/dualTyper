name: Core CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        run: swift test
      - name: Run dependency-free core tests
        run: ./scripts/test-core.sh
      - name: Run repository contract tests
        run: python3 -m unittest discover -s Tests/RepositoryContractTests -v
